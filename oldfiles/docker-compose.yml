version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: workorders_db
    environment:
      POSTGRES_DB: workorders
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - ./data:/docker-entrypoint-initdb.d/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/load-data.sql:/docker-entrypoint-initdb.d/02-load-data.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d workorders"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PostgREST - Auto REST API for PostgreSQL (No backend coding needed!)
  postgrest:
    image: postgrest/postgrest
    container_name: workorders_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://admin:admin123@postgres:5432/workorders
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: admin
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3001
    ports:
      - "3001:3000"

  # Swagger UI for API documentation (optional)
  swagger:
    image: swaggerapi/swagger-ui
    container_name: workorders_docs
    depends_on:
      - postgrest
    environment:
      API_URL: http://localhost:3001
    ports:
      - "3002:8080"

volumes:
  postgres_data:
